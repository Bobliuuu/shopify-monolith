name: 'shopify_monolith'
version: '1.0.0'
config-version: 2

profile: 'shopify_monolith'

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  shopify_monolith:
    +tags: [shopify_monolith]
    base:
      +schema: base
      +materialized: view
      +tags: [base]
    staging:
      +schema: staging
      +materialized: view
      +tags: [staging]
    intermediate:
      +schema: intermediate
      +materialized: view
      +tags: [intermediate]
    marts:
      dimensions:
        +schema: dim
        +materialized: table
        +tags: [dimension]
      facts:
        +schema: fct
        +materialized: table
        +tags: [fact]
      greenfield:
        +schema: mart
        +materialized: view
        +tags: [mart]
    views:
      +schema: analytics_views
      +materialized: view
      +tags: [analytics_view]

vars:
  target_database: shopify_monolith
  target_schema: dev
